allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

layout.buildDirectory = file("../build")

subprojects {
    project.layout.buildDirectory = file("${layout.buildDirectory.get().asFile}/${project.name}")
}

subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}