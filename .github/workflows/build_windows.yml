name: Build Windows EXE

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 🎯 كتابة ملف الحساب السري
      - name: Create Service Account File
        shell: bash
        run: |
          mkdir -p assets
          cat << 'EOF' > assets/service-account.json
          ${{ secrets.SERVICE_ACCOUNT_JSON }}
          EOF

      # 🧹 تفعيل الويندوز وتنظيف المشروع
      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - run: flutter clean
      - run: flutter pub get

      # 🛠️ 1. التوليد المبدئي لفك ضغط Firebase بدون إيقاف السكريبت عند الخطأ
      - name: Extract Firebase SDK
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          flutter build windows --release
          exit 0

      # 🛠️ 2. تعديل الملف المستخرج مباشرة
      - name: Patch Firebase CMake File
        shell: powershell
        run: |
          $dir = "build/windows/x64/extracted/firebase_cpp_sdk_windows"
          Get-ChildItem -Path $dir -Recurse -Filter "CMakeLists.txt" | ForEach-Object {
              Write-Host "Patching file: $($_.FullName)"
              (Get-Content $_.FullName) -replace 'cmake_minimum_required\(VERSION .*\)', 'cmake_minimum_required(VERSION 3.10...3.25)' | Set-Content $_.FullName
          }

      # 🚀 3. البناء النهائي المستقر
      - name: Build Windows Executable
        run: flutter build windows --release

      # 📦 رفع ملفات الويندوز
      - name: Upload Windows Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-app-release
          path: build/windows/x64/runner/Release/