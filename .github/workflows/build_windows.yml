name: Build Windows EXE

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 🎯 كتابة ملف الحساب السري
      - name: Create Service Account File
        shell: bash
        run: |
          mkdir -p assets
          cat << 'EOF' > assets/service-account.json
          ${{ secrets.SERVICE_ACCOUNT_JSON }}
          EOF

      # 🧹 تفعيل الويندوز وتنظيف المشروع
      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - run: flutter clean
      - run: flutter pub get

      # 🛠️ استخراج وتعديل ملف Firebase بشكل مسبق وقاطع
      - name: Pre-generate and Patch Firebase
        shell: powershell
        run: |
          # 1. إنشاء مجلد البناء المبدئي
          New-Item -ItemType Directory -Force -Path build/windows/x64
          Set-Location build/windows/x64
          
          # 2. توليد ملفات CMake المبدئية لفك ضغط firebase_cpp_sdk_windows
          cmake -G "Visual Studio 17 2022" -A x64 ../../windows
          
          Set-Location ../../
          
          # 3. استبدال السطر المسبب للمشكلة داخل ملف Firebase بالكامل
          $file = "build/windows/x64/extracted/firebase_cpp_sdk_windows/CMakeLists.txt"
          if (Test-Path $file) {
              Write-Host "Modifying Firebase CMake file..."
              (Get-Content $file) -replace 'cmake_minimum_required\(VERSION .*\)', 'cmake_minimum_required(VERSION 3.10...3.25)' | Set-Content $file
          }

      # 🚀 بناء ملف الـ EXE النهائي
      - name: Build Windows Executable
        run: flutter build windows --release

      # 📦 رفع ملفات الويندوز
      - name: Upload Windows Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-app-release
          path: build/windows/x64/runner/Release/