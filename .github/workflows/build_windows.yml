name: Build Windows EXE

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 🎯 كتابة ملف الحساب السري
      - name: Create Service Account File
        shell: bash
        run: |
          mkdir -p assets
          cat << 'EOF' > assets/service-account.json
          ${{ secrets.SERVICE_ACCOUNT_JSON }}
          EOF

      # 🛠️ إنشاء ملف إعدادات CMake المباشر لحل توافقية Firebase
      - name: Setup CMake Policy Overrides
        shell: bash
        run: |
          echo 'set(CMAKE_POLICY_VERSION_MINIMUM "3.5" CACHE STRING "" FORCE)' > cmake_init.txt

      # 🧹 تفعيل الويندوز وتنظيف المشروع
      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - run: flutter clean
      - run: flutter pub get

      # 🚀 بناء ملف الـ EXE مع حشو الإعداد المباشر
      - name: Build Windows Executable
        run: flutter build windows --release
        env:
          CMAKE_INITIAL_CACHE: "${{ github.workspace }}/cmake_init.txt"

      # 📦 رفع ملفات الويندوز
      - name: Upload Windows Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-app-release
          path: build/windows/x64/runner/Release/