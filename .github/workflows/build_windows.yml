name: Build Windows EXE

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 🎯 كتابة ملف الحساب السري
      - name: Create Service Account File
        shell: bash
        run: |
          mkdir -p assets
          cat << 'EOF' > assets/service-account.json
          ${{ secrets.SERVICE_ACCOUNT_JSON }}
          EOF

      # 🧹 تفعيل الويندوز وتنظيف المشروع
      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - run: flutter clean
      - run: flutter pub get

      # 🛠️ توليد ملفات البناء وتعديل ملف Firebase الداخلي تلقائياً
      - name: Patch Firebase CMake Compatibility
        shell: powershell
        run: |
          # تشغيل التوليد المبدئي لفك ضغط الحزم
          flutter pub get
          
          # مسح ملفات البناء القديمة إذا وجدت
          if (Test-Path "build\windows") { Remove-Item -Recurse -Force "build\windows" }
          
          # استخراج وتعديل ملف CMake الخاص بـ Firebase تلقائياً قبل البناء
          $cmakeFile = "build/windows/x64/extracted/firebase_cpp_sdk_windows/CMakeLists.txt"
          
          # في حال وجود حزم Firebase، يتم التعديل فور استخراجها
          $null = flutter build windows --release 2>&1
          if (Test-Path $cmakeFile) {
            (Get-Content $cmakeFile) -replace 'cmake_minimum_required\(VERSION 3.2\)', 'cmake_minimum_required(VERSION 3.10...3.25)' | Set-Content $cmakeFile
            (Get-Content $cmakeFile) -replace 'cmake_minimum_required\(VERSION 3.3\)', 'cmake_minimum_required(VERSION 3.10...3.25)' | Set-Content $cmakeFile
          }

      # 🚀 بناء ملف الـ EXE النهائيات
      - name: Build Windows Executable
        run: flutter build windows --release

      # 📦 رفع ملفات الويندوز
      - name: Upload Windows Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-app-release
          path: build/windows/x64/runner/Release/