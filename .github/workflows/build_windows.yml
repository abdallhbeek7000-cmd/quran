name: Build Windows EXE

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 🎯 كتابة ملف الحساب السري
      - name: Create Service Account File
        shell: bash
        run: |
          mkdir -p assets
          cat << 'EOF' > assets/service-account.json
          ${{ secrets.SERVICE_ACCOUNT_JSON }}
          EOF

      # 🧹 تفعيل الويندوز وتنظيف المشروع
      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - run: flutter clean
      - run: flutter pub get

      # 🛠️ 1. التوليد المبدئي لفك ضغط Firebase
      - name: Extract Firebase SDK
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          flutter build windows --release
          exit 0

      # 🛠️ 2. تعديل ملف Firebase المستخرج
      - name: Patch Firebase CMake File
        shell: powershell
        run: |
          $dir = "build/windows/x64/extracted/firebase_cpp_sdk_windows"
          Get-ChildItem -Path $dir -Recurse -Filter "CMakeLists.txt" | ForEach-Object {
              Write-Host "Patching file: $($_.FullName)"
              (Get-Content $_.FullName) -replace 'cmake_minimum_required\(VERSION .*\)', 'cmake_minimum_required(VERSION 3.10...3.25)' | Set-Content $_.FullName
          }

      # 🚀 3. البناء النهائي مع تعطيل تحذير Coroutine MSVC
      - name: Build Windows Executable
        shell: cmd
        run: |
          set CL=/D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
          flutter build windows --release

      # 🛠️ 4. تجميع كافة الـ DLLs المتبقية وتأكيد وجود flutter_windows.dll
      - name: Bundle All Dependencies
        shell: powershell
        run: |
          $targetDir = "build/windows/x64/runner/Release"
          Get-ChildItem -Path "build/windows/x64" -Recurse -Filter "*.dll" | ForEach-Object {
              if ($_.FullName -ne "$targetDir\$($_.Name)") {
                  Copy-Item -Path $_.FullName -Destination $targetDir -Force
              }
          }

      # 📦 5. رفع كامل المجلد النظيف والمكتمل
      - name: Upload Windows Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-app-release
          path: build/windows/x64/runner/Release/