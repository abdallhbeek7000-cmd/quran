name: Build Windows EXE

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 🎯 كتابة ملف الحساب السري
      - name: Create Service Account File
        shell: bash
        run: |
          mkdir -p assets
          cat << 'EOF' > assets/service-account.json
          ${{ secrets.SERVICE_ACCOUNT_JSON }}
          EOF

      # 🧹 تفعيل الويندوز وتنظيف المشروع
      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - run: flutter clean
      - run: flutter pub get

      # 🛠️ فك ضغط وتوليد ملفات Firebase دون إيقاف التدفّق ثم تعديل ملف CMake
      - name: Generate and Patch Firebase CMake
        shell: powershell
        run: |
          $ErrorActionPreference = 'SilentlyContinue'
          
          # تشغيل البناء الأولي لاستخراج مجلد firebase_cpp_sdk_windows
          cmd /c "flutter build windows --release"
          
          $cmakeFile = "build/windows/x64/extracted/firebase_cpp_sdk_windows/CMakeLists.txt"
          
          if (Test-Path $cmakeFile) {
            Write-Host "Patching Firebase CMakeLists.txt..."
            $content = Get-Content $cmakeFile
            $content = $content -replace 'cmake_minimum_required\(VERSION .*\)', 'cmake_minimum_required(VERSION 3.10...3.25)'
            Set-Content -Path $cmakeFile -Value $content
          }

      # 🚀 البناء النهائي بعد تعديل ملف التوافقية
      - name: Build Windows Executable
        run: flutter build windows --release

      # 📦 رفع ملفات الويندوز
      - name: Upload Windows Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-app-release
          path: build/windows/x64/runner/Release/