name: Build Windows EXE

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 🎯 كتابة ملف الحساب السري
      - name: Create Service Account File
        shell: bash
        run: |
          mkdir -p assets
          cat << 'EOF' > assets/service-account.json
          ${{ secrets.SERVICE_ACCOUNT_JSON }}
          EOF

      # 🧹 تفعيل الويندوز وتنظيف المشروع
      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - run: flutter clean
      - run: flutter pub get

      # 🚀 بناء ملف الـ EXE مع تعديل سياسة Firebase ديناميكياً
      - name: Build Windows Executable
        shell: powershell
        run: |
          # 1. تشغيل مراقب في الخلفية يصحح ملف Firebase فور استخراجه
          $job = Start-Job -ScriptBlock {
              $file = "build/windows/x64/extracted/firebase_cpp_sdk_windows/CMakeLists.txt"
              while ($true) {
                  if (Test-Path $file) {
                      (Get-Content $file) -replace 'cmake_minimum_required\(VERSION .*\)', 'cmake_minimum_required(VERSION 3.10...3.25)' | Set-Content $file
                      break
                  }
                  Start-Sleep -Milliseconds 200
              }
          }
          
          # 2. تشغيل أمر البناء الأصلي
          flutter build windows --release
          
          # 3. إنهاء المهمة
          Stop-Job $job | Remove-Job

      # 📦 رفع ملفات الويندوز
      - name: Upload Windows Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-app-release
          path: build/windows/x64/runner/Release/