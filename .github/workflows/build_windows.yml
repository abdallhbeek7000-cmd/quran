name: Build Windows EXE

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 1. كتابة ملف الحساب السري
      - name: Create Service Account File
        shell: bash
        run: |
          mkdir -p assets
          cat << 'EOF' > assets/service-account.json
          ${{ secrets.SERVICE_ACCOUNT_JSON }}
          EOF

      # 2. إعداد الويندوز وتجهيز الحزم
      - name: Enable Windows Desktop and Get Packages
        run: |
          flutter config --enable-windows-desktop
          flutter pub get

      # 3. التوليد المبدئي لفك ضغط Firebase SDK
      - name: Extract Firebase SDK
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          flutter build windows --release
          exit 0

      # 4. تعديل ملف Firebase المستخرج
      - name: Patch Firebase CMake File
        shell: powershell
        run: |
          $dir = "build/windows/x64/extracted/firebase_cpp_sdk_windows"
          if (Test-Path $dir) {
              Get-ChildItem -Path $dir -Recurse -Filter "CMakeLists.txt" | ForEach-Object {
                  Write-Host "Patching file: $($_.FullName)"
                  (Get-Content $_.FullName) -replace 'cmake_minimum_required\(VERSION .*\)', 'cmake_minimum_required(VERSION 3.10...3.25)' | Set-Content $_.FullName
              }
          }

      # 5. البناء النهائي والتجميع الرئيسي
      - name: Build Windows Executable
        shell: cmd
        run: |
          set CL=/D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
          flutter build windows --release

      # 6. تأكيد وجود وتجميع كافة ملفات AOT و data و service-account
      - name: Ensure Complete Release Bundle
        shell: powershell
        run: |
          $target = "build/windows/x64/runner/Release"
          
          # التأكد من وجود مجلد data
          New-Item -ItemType Directory -Force -Path "$target\data"

          # البحث عن ملف app.so ونسخه داخل data في حال عدم تجميعه التلقائي
          $appSo = Get-ChildItem -Path "$env:GITHUB_WORKSPACE\build" -Recurse -Filter "app.so" | Select-Object -First 1
          if ($appSo -and -not (Test-Path "$target\data\app.so")) {
              Copy-Item -Path $appSo.FullName -Destination "$target\data\app.so" -Force
          }

          # زرع ملف service-account داخل assets
          if (Test-Path "assets/service-account.json") {
              $assetsTarget = "$target\data\flutter_assets\assets"
              New-Item -ItemType Directory -Force -Path $assetsTarget
              Copy-Item -Path "assets/service-account.json" -Destination $assetsTarget -Force
          }

      # 7. رفع مجلد Release المكتمل
      - name: Upload Windows Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-app-release
          path: build/windows/x64/runner/Release/